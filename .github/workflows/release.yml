name: Release installer

# Builds the Windows installer, SolidSeas-Setup-<version>.exe, for a published release and
# attaches it, with its SHA-256, to that release. It can also be run by hand for an existing
# release tag, which replaces the installer attached to it. The extension packages attached to
# the release, checked against its SHA256SUMS.txt, are the ones the viewer it builds accepts
# and the installer carries; a release with none gives a viewer that accepts none. Last, it
# replaces that SHA256SUMS.txt with one list for the whole release: the installer, the
# single-file viewer and the packages.
#
# It runs only on GitHub's own Windows runner, never on the project's self-hosted machine,
# and never for a pull request: it builds only a tag a maintainer has released. The token
# may write the repository's contents, which is what attaching a file to a release needs,
# and nothing else. Every action is pinned to a full commit, with its version beside it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build, for example v0.2.335"
        required: true
        type: string

permissions:
  contents: write

jobs:
  installer:
    name: Windows installer
    if: github.repository == 'SolidSeas/SolidSeas'
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: release-installer-${{ github.event.release.tag_name || inputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      INNO_SETUP_VERSION: "6.7.1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check the tag
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Not a release tag: $env:TAG" }

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Fetch the private SOLIDWORKS fixtures
        shell: bash
        env:
          FIXTURES_DEPLOY_KEY: ${{ secrets.FIXTURES_DEPLOY_KEY }}
          FIXTURES_REQUIRED: "1"
        run: scripts/ci-clone-fixtures.sh "$RUNNER_TEMP/fixtures"

      - name: Check the version matches the tag
        run: |
          $init = Get-Content -LiteralPath src\solidseas\__init__.py -Raw
          $version = [regex]::Match($init, '(?m)^__version__ = "(\d+\.\d+\.\d+)"').Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "The tag $env:TAG does not match __version__ $version" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install Inno Setup
        run: |
          choco install innosetup --version $env:INNO_SETUP_VERSION -y --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { throw "choco could not install Inno Setup $env:INNO_SETUP_VERSION" }
          # ISCC.exe carries no version resource (it reads 0.0.0.0), so ask Chocolatey what it installed.
          $found = (choco list innosetup --exact --limit-output) -replace '^innosetup\|', ''
          "Inno Setup $found"
          if ($found -ne $env:INNO_SETUP_VERSION) { throw "Expected Inno Setup $env:INNO_SETUP_VERSION, found $found" }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe is not at $iscc" }

      # The extension packages are built on the Windows PC (scripts\build-extensions.ps1) and
      # attached to the release before this runs. The viewer accepts only the packages listed
      # in accepted.json at build time, so the build takes those exact files from the release.
      - name: Fetch the release's extension packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $names = @(gh release view $env:TAG --json assets --jq '.assets[].name' --repo $env:GITHUB_REPOSITORY)
          if ($LASTEXITCODE -ne 0) { throw "gh could not list the files attached to $env:TAG" }
          if (@($names | Where-Object { $_ -like '*.zip' }).Count -eq 0) {
            "No extension packages are attached to $env:TAG, so this viewer is built without any and accepts none." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "EXTENSIONS=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          else {
            New-Item -ItemType Directory -Force -Path 'dist\extensions' | Out-Null
            gh release download $env:TAG --pattern '*.zip' --pattern SHA256SUMS.txt --dir dist\extensions `
              --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "gh could not download the extension packages of $env:TAG" }
            "EXTENSIONS=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Check the extension packages against SHA256SUMS.txt
        if: env.EXTENSIONS == 'true'
        run: |
          $sums = 'dist\extensions\SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $sums)) { throw "$env:TAG has extension packages but no SHA256SUMS.txt" }
          # Lines as sha256sum writes them. A name may carry a folder (extensions/<zip>, as
          # scripts\build-viewer.ps1 -WithExtensions writes it); only the file name counts.
          $listed = @{}
          foreach ($line in Get-Content -LiteralPath $sums) {
            if ($line -match '^([0-9a-fA-F]{64})\s+\*?(\S.*?)\s*$') {
              $listed[($Matches[2] -split '[\\/]')[-1]] = $Matches[1].ToLowerInvariant()
            }
          }
          $zips = @(Get-ChildItem -LiteralPath 'dist\extensions' -Filter '*.zip' -File | Sort-Object Name)
          foreach ($zip in $zips) {
            if (-not $zip.Name.EndsWith("-$env:VERSION.zip")) {
              throw "$($zip.Name) is not a package of $env:VERSION (its name must end in -$env:VERSION.zip)"
            }
            if (-not $listed.ContainsKey($zip.Name)) { throw "SHA256SUMS.txt does not list $($zip.Name)" }
            $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $listed[$zip.Name]) { throw "$($zip.Name) does not match its SHA-256 in SHA256SUMS.txt" }
            "$hash  $($zip.Name)"
          }
          foreach ($name in $listed.Keys) {
            if ($name -like '*.zip' -and -not ($zips.Name -contains $name)) {
              throw "SHA256SUMS.txt lists $name, which is not attached to $env:TAG"
            }
          }

      - name: Accept the extension packages
        if: env.EXTENSIONS == 'true'
        env:
          PYTHONPATH: src
        run: |
          # The build environment the installer is built in, with the locked packages, made
          # here so the core can read the packages' manifests with its own code.
          $venv = Join-Path $env:RUNNER_TEMP 'venv'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw "Could not make the environment $venv" }
          $python = Join-Path $venv 'Scripts\python.exe'
          & $python -m pip install --disable-pip-version-check --require-hashes --no-deps `
            --only-binary ":all:" -r requirements\build-windows.txt
          if ($LASTEXITCODE -ne 0) { throw "pip could not install the locked requirements" }
          $zips = @(Get-ChildItem -LiteralPath 'dist\extensions' -Filter '*.zip' -File | Sort-Object Name |
            ForEach-Object { $_.FullName })
          $accepted = 'src\solidseas_app\extensions\accepted.json'
          & $python -m solidseas_app.extensions.package accept @zips --out $accepted
          if ($LASTEXITCODE -ne 0) { throw "accepted.json was not written" }
          # Each package must be one this core adds, checked as the viewer checks it.
          $check = Join-Path $env:RUNNER_TEMP 'check-packages.py'
          Set-Content -LiteralPath $check -Encoding utf8 -Value @'
          import sys
          from solidseas_app.extensions import check_package
          from solidseas_app.extensions.package import read_accepted
          accepted = read_accepted(sys.argv[1])
          for path in sys.argv[2:]:
              print(check_package(path, accepted=accepted).manifest.id, 'accepted')
          '@
          & $python $check $accepted @zips
          if ($LASTEXITCODE -ne 0) { throw "A package of $env:TAG is one this core refuses" }
          "This viewer accepts the {0} extension package(s) attached to {1}." -f $zips.Count, $env:TAG |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Build the installer
        run: |
          $options = @{ Venv = "$env:RUNNER_TEMP\venv"; Python = 'python' }
          if ($env:EXTENSIONS -eq 'true') { $options.ExtensionsFolder = 'dist\extensions' }
          scripts\build-installer.ps1 @options

      - name: Install it, run the self-test and uninstall it
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $setup = "dist\SolidSeas-Setup-$env:VERSION.exe"
          $app = Join-Path $env:RUNNER_TEMP 'SolidSeas'
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$app", "/LOG=$log")
          if ($p.ExitCode -ne 0) { Get-Content -LiteralPath $log; throw "Setup failed with exit code $($p.ExitCode)" }
          $exe = Join-Path $app 'SolidSeasViewer.exe'
          foreach ($needed in @($exe, (Join-Path $app '_internal\licenses\BUNDLED-FILES.txt'),
                                (Join-Path $app '_internal\licenses\LGPL-3.0.txt'))) {
            if (-not (Test-Path -LiteralPath $needed)) { throw "Not installed: $needed" }
          }
          if ($env:EXTENSIONS -eq 'true') {
            # The list of the packages this viewer accepts, and the packages themselves.
            $list = Join-Path $app '_internal\solidseas_app\extensions\accepted.json'
            if (-not (Test-Path -LiteralPath $list)) { throw "Not installed: $list" }
            $carried = @(Get-ChildItem -LiteralPath (Join-Path $app 'SolidSeas extensions') -Filter '*.zip' -File)
            if ($carried.Count -eq 0) { throw "The installer carries none of the extension packages" }
          }
          # The 3D view is left off: the runner has no display and no OpenGL.
          $out = Join-Path $env:RUNNER_TEMP 'selftest'
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @(
            '--self-test', (Resolve-Path tests\fixtures).Path, '--screenshot-dir', $out, '--select-all')
          $report = Join-Path $out 'selftest.json'
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report -TotalCount 200 }
          if ($p.ExitCode -ne 0) { throw "The installed viewer's self-test failed with exit code $($p.ExitCode)" }
          $p = Start-Process -FilePath (Join-Path $app 'unins000.exe') -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          if ($p.ExitCode -ne 0) { throw "Uninstall failed with exit code $($p.ExitCode)" }
          # The uninstaller finishes from a copy of itself, so give it a moment.
          for ($i = 0; $i -lt 30 -and (Test-Path -LiteralPath $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path -LiteralPath $exe) { throw "Uninstall left $exe behind" }

      - name: Build the single-file viewer and run its self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The same locked environment the installer was built from; nothing is installed again.
          scripts\build-viewer.ps1 -Venv "$env:RUNNER_TEMP\venv" -SkipInstall
          if ($LASTEXITCODE -ne 0) { throw "The single-file build failed" }
          $exe = Resolve-Path 'dist\SolidSeasViewer.exe'
          $out = Join-Path $env:RUNNER_TEMP 'selftest-onefile'
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @(
            '--self-test', (Resolve-Path tests\fixtures).Path, '--screenshot-dir', $out, '--select-all')
          if ($p.ExitCode -ne 0) { throw "The single-file viewer's self-test failed with exit code $($p.ExitCode)" }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'dist\SolidSeasViewer.exe.sha256' -Value "$hash  SolidSeasViewer.exe`n" -NoNewline -Encoding ascii
          # The list of every library inside the single-file viewer, which PyInstaller's work
          # folder for the spec holds after the build.
          $bundled = 'build\pyinstaller\SolidSeasViewer\BUNDLED-FILES.txt'
          if (-not (Test-Path -LiteralPath $bundled)) { throw "The single-file build wrote no $bundled" }
          Copy-Item -LiteralPath $bundled -Destination 'dist\BUNDLED-FILES.txt' -Force

      # One list for every file a person downloads to run or add: the installer under both its
      # names, the single-file viewer and the extension packages. It replaces the list attached
      # by hand, which names only the packages and stays in dist\extensions as the check above
      # read it. The packages' lines are the same, since they were checked against it; a run
      # by hand later downloads this list instead, and its check reads only the packages' lines.
      - name: Write SHA256SUMS.txt for the release
        run: |
          $setup = "dist\SolidSeas-Setup-$env:VERSION.exe"
          # The same installer under a name without the version, so a link to the latest
          # release's SolidSeas-Setup.exe (the website's download) always finds the newest.
          Copy-Item -LiteralPath $setup -Destination 'dist\SolidSeas-Setup.exe' -Force
          $files = @(Get-Item -LiteralPath $setup, 'dist\SolidSeas-Setup.exe', 'dist\SolidSeasViewer.exe')
          if ($env:EXTENSIONS -eq 'true') {
            $files += @(Get-ChildItem -LiteralPath 'dist\extensions' -Filter '*.zip' -File | Sort-Object Name)
          }
          $sums = foreach ($f in $files) {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $f.Name
          }
          # LF line ends, so sha256sum -c reads the list on Linux and macOS too
          Set-Content -LiteralPath 'dist\SHA256SUMS.txt' -Value ((@($sums) -join "`n") + "`n") -NoNewline -Encoding ascii
          Get-Content -LiteralPath 'dist\SHA256SUMS.txt'

      - name: Attach the installer and the single-file viewer to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = "dist\SolidSeas-Setup-$env:VERSION.exe"
          # Only the files this workflow built or wrote, and SOURCE.txt, which says where the source
          # of the LGPL software in them is, beside them as the LGPL asks. --clobber replaces an
          # attached file of the same name: SHA256SUMS.txt replaces the list attached by hand, and
          # the extension packages and source archives attached by hand are never sent.
          gh release upload $env:TAG $setup "$setup.sha256" 'dist\SolidSeas-Setup.exe' `
            'dist\SolidSeasViewer.exe' 'dist\SolidSeasViewer.exe.sha256' 'dist\BUNDLED-FILES.txt' `
            'dist\SHA256SUMS.txt' 'licenses\SOURCE.txt' --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "gh could not attach the installer to $env:TAG" }
