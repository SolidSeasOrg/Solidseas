[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solidseas"
dynamic = ["version"]
description = "Read, preview and manage SOLIDWORKS files, with or without SOLIDWORKS. An independent project, not affiliated with or endorsed by Dassault Systèmes."
readme = "README.md"
# SolidSeas' own code is Apache-2.0; the wheel also carries three.js (MIT) for the REST service's
# viewer and a port of earcut (ISC) in the tessellator (NOTICE, THIRD_PARTY_NOTICES.txt).
license = "Apache-2.0 AND MIT AND ISC"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.txt", "src/solidseas/serve/viewer/three/LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "olefile>=0.47",
]
keywords = ["solidworks", "sldprt", "sldasm", "cad", "step", "3mf", "stl", "bom"]
# No "License ::" classifier: the licence is the expression above, which rules them out.
# The Python versions are the ones scripts/smoke-wheel.sh installs and checks the wheel on.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/SolidSeasOrg/Solidseas"
Documentation = "https://github.com/SolidSeasOrg/Solidseas/tree/main/docs"
Issues = "https://github.com/SolidSeasOrg/Solidseas/issues"
Changelog = "https://github.com/SolidSeasOrg/Solidseas/blob/main/CHANGELOG.md"

[project.optional-dependencies]
app = ["PySide6>=6.7"]
build = ["PySide6-Essentials>=6.7", "pyinstaller>=6", "truststore>=0.9"]
cad = ["cadquery>=2.4"]
swapi = ["pywin32>=306; sys_platform == 'win32'"]
ai = ["truststore>=0.9"]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6", "PyYAML>=6"]
image = ["Pillow>=10"]

[project.scripts]
solidseas = "solidseas.cli:main"

[tool.setuptools.dynamic]
version = { attr = "solidseas.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# The service's reference viewer (docs/API.md 8.18): its page, script and style, and three.js.
[tool.setuptools.package-data]
"solidseas.serve" = ["viewer/*.*", "viewer/three/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "research"]
markers = [
    "occt: the opt-in OCCT oracle; skipped unless SOLIDSEAS_OCCT_PYTHON names an interpreter where OCP imports (tests/README.md)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
